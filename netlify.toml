[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"
NITRO_PRESET = "netlify"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"
Service-Worker-Allowed = "/"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "no-cache"
